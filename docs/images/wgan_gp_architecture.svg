<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="260" fill="#0f172a"/>

  <rect x="30" y="30" width="130" height="55" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="95" y="62" fill="#e2e8f0" font-size="12" text-anchor="middle">Real image x</text>

  <rect x="30" y="170" width="130" height="55" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="95" y="202" fill="#e2e8f0" font-size="12" text-anchor="middle">Fake image G(z)</text>

  <rect x="210" y="100" width="160" height="60" rx="8" fill="#581c87" stroke="#c084fc" stroke-width="2"/>
  <text x="290" y="125" fill="#f3e8ff" font-size="12" text-anchor="middle">x_hat = eps*x +</text>
  <text x="290" y="145" fill="#f3e8ff" font-size="12" text-anchor="middle">(1-eps)*G(z)</text>

  <rect x="420" y="90" width="140" height="80" rx="8" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
  <text x="490" y="125" fill="#fed7aa" font-size="14" text-anchor="middle">Critic D</text>
  <text x="490" y="145" fill="#fed7aa" font-size="10" text-anchor="middle">D(x_hat)</text>
  <text x="490" y="160" fill="#fed7aa" font-size="10" text-anchor="middle">+ gradient wrt x_hat</text>

  <rect x="610" y="30" width="260" height="60" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="740" y="55" fill="#e2e8f0" font-size="12" text-anchor="middle">Gradient Penalty</text>
  <text x="740" y="73" fill="#94a3b8" font-size="10" text-anchor="middle">lambda * (||grad D(x_hat)||2 - 1)^2</text>

  <rect x="610" y="170" width="260" height="60" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="740" y="195" fill="#e2e8f0" font-size="12" text-anchor="middle">Total Critic Loss</text>
  <text x="740" y="213" fill="#94a3b8" font-size="10" text-anchor="middle">D(fake) - D(real) + GP</text>

  <path d="M160,55 L210,120" stroke="#94a3b8" stroke-width="2" marker-end="url(#a6)"/>
  <path d="M160,195 L210,140" stroke="#94a3b8" stroke-width="2" marker-end="url(#a6)"/>
  <path d="M370,130 L420,130" stroke="#94a3b8" stroke-width="2" marker-end="url(#a6)"/>
  <path d="M560,110 L610,60" stroke="#94a3b8" stroke-width="2" marker-end="url(#a6)"/>
  <path d="M560,150 L610,200" stroke="#94a3b8" stroke-width="2" marker-end="url(#a6)"/>
  <path d="M740,90 L740,170" stroke="#94a3b8" stroke-width="2" marker-end="url(#a6)" stroke-dasharray="4"/>

  <defs>
    <marker id="a6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="450" y="250" fill="#64748b" font-size="12" text-anchor="middle">بدل Weight Clipping بنفرض Lipschitz constraint عن طريق عقاب الـ gradient norm</text>
</svg>

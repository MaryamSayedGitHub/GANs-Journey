<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="300" fill="#0f172a"/>

  <rect x="20" y="110" width="110" height="70" rx="8" fill="#3730a3" stroke="#818cf8" stroke-width="2"/>
  <text x="75" y="150" fill="#e0e7ff" font-size="14" text-anchor="middle">Noise z</text>
  <text x="75" y="167" fill="#c7d2fe" font-size="11" text-anchor="middle">~ N(0,I)</text>

  <rect x="180" y="90" width="150" height="110" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
  <text x="255" y="140" fill="#e2e8f0" font-size="15" text-anchor="middle">Generator G</text>
  <text x="255" y="160" fill="#5eead4" font-size="11" text-anchor="middle">FC layers</text>
  <text x="255" y="176" fill="#5eead4" font-size="11" text-anchor="middle">G(z) -&gt; fake image</text>

  <rect x="380" y="30" width="130" height="70" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="445" y="65" fill="#e2e8f0" font-size="13" text-anchor="middle">Fake image</text>
  <text x="445" y="82" fill="#93c5fd" font-size="10" text-anchor="middle">G(z)</text>

  <rect x="380" y="200" width="130" height="70" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="445" y="235" fill="#e2e8f0" font-size="13" text-anchor="middle">Real image</text>
  <text x="445" y="252" fill="#93c5fd" font-size="10" text-anchor="middle">x</text>

  <rect x="560" y="90" width="150" height="110" rx="8" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
  <text x="635" y="140" fill="#fed7aa" font-size="15" text-anchor="middle">Discriminator D</text>
  <text x="635" y="160" fill="#fed7aa" font-size="11" text-anchor="middle">FC layers</text>
  <text x="635" y="176" fill="#fed7aa" font-size="11" text-anchor="middle">real or fake?</text>

  <rect x="760" y="110" width="120" height="70" rx="8" fill="#4c0519" stroke="#fb7185" stroke-width="2"/>
  <text x="820" y="145" fill="#fecdd3" font-size="13" text-anchor="middle">D(x) in [0,1]</text>
  <text x="820" y="162" fill="#fda4af" font-size="10" text-anchor="middle">probability</text>

  <path d="M130,145 L180,145" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M330,120 L380,90" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M510,70 L560,120" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M510,235 L560,170" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M710,145 L760,145" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow2)"/>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="450" y="290" fill="#64748b" font-size="12" text-anchor="middle">min_G max_D  E[log D(x)] + E[log(1 - D(G(z)))]</text>
</svg>

<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="260" fill="#0f172a"/>

  <rect x="30" y="90" width="120" height="70" rx="8" fill="#3730a3" stroke="#818cf8" stroke-width="2"/>
  <text x="90" y="130" fill="#e0e7ff" font-size="14" text-anchor="middle">Generator G</text>

  <rect x="220" y="90" width="140" height="70" rx="8" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
  <text x="290" y="120" fill="#fed7aa" font-size="14" text-anchor="middle">Critic D</text>
  <text x="290" y="140" fill="#fed7aa" font-size="10" text-anchor="middle">(no sigmoid, score)</text>

  <rect x="430" y="30" width="200" height="60" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="530" y="55" fill="#e2e8f0" font-size="12" text-anchor="middle">clip weights w</text>
  <text x="530" y="73" fill="#94a3b8" font-size="10" text-anchor="middle">to [-c, c] after each step</text>

  <rect x="430" y="160" width="200" height="60" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="530" y="185" fill="#e2e8f0" font-size="12" text-anchor="middle">Loss (Wasserstein)</text>
  <text x="530" y="203" fill="#94a3b8" font-size="10" text-anchor="middle">D(real) - D(fake)</text>

  <rect x="680" y="90" width="190" height="70" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
  <text x="775" y="120" fill="#e2e8f0" font-size="13" text-anchor="middle">Train Critic n_critic</text>
  <text x="775" y="140" fill="#5eead4" font-size="11" text-anchor="middle">times per G step</text>

  <path d="M150,125 L220,125" stroke="#94a3b8" stroke-width="2" marker-end="url(#a5)"/>
  <path d="M360,110 L430,60" stroke="#94a3b8" stroke-width="2" marker-end="url(#a5)"/>
  <path d="M360,140 L430,190" stroke="#94a3b8" stroke-width="2" marker-end="url(#a5)"/>
  <path d="M630,190 L680,140" stroke="#94a3b8" stroke-width="2" marker-end="url(#a5)"/>
  <path d="M630,60 L680,110" stroke="#94a3b8" stroke-width="2" marker-end="url(#a5)"/>

  <defs>
    <marker id="a5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="450" y="245" fill="#64748b" font-size="12" text-anchor="middle">Weight Clipping بيضمن Lipschitz constraint لكنه بيسبب مشاكل تدريب أحيانًا (WGAN-GP بيحلها)</text>
</svg>

<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="300" fill="#0f172a"/>

  <text x="450" y="30" fill="#e2e8f0" font-size="16" text-anchor="middle">Generator: Transposed Convolutions (upsampling)</text>

  <rect x="30" y="60" width="60" height="60" fill="#3730a3" stroke="#818cf8" stroke-width="2"/>
  <text x="60" y="95" fill="#e0e7ff" font-size="10" text-anchor="middle">z</text>
  <text x="60" y="135" fill="#94a3b8" font-size="9" text-anchor="middle">100x1x1</text>

  <rect x="130" y="55" width="60" height="70" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
  <text x="160" y="135" fill="#94a3b8" font-size="9" text-anchor="middle">4x4x512</text>

  <rect x="230" y="50" width="60" height="80" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
  <text x="260" y="140" fill="#94a3b8" font-size="9" text-anchor="middle">8x8x256</text>

  <rect x="330" y="45" width="60" height="90" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
  <text x="360" y="145" fill="#94a3b8" font-size="9" text-anchor="middle">16x16x128</text>

  <rect x="430" y="40" width="60" height="100" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
  <text x="460" y="150" fill="#94a3b8" font-size="9" text-anchor="middle">32x32x64</text>

  <rect x="530" y="35" width="60" height="110" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="560" y="155" fill="#94a3b8" font-size="9" text-anchor="middle">64x64x3</text>

  <path d="M90,90 L130,90" stroke="#94a3b8" stroke-width="2" marker-end="url(#a3)"/>
  <path d="M190,90 L230,90" stroke="#94a3b8" stroke-width="2" marker-end="url(#a3)"/>
  <path d="M290,90 L330,90" stroke="#94a3b8" stroke-width="2" marker-end="url(#a3)"/>
  <path d="M390,90 L430,90" stroke="#94a3b8" stroke-width="2" marker-end="url(#a3)"/>
  <path d="M490,90 L530,90" stroke="#94a3b8" stroke-width="2" marker-end="url(#a3)"/>

  <text x="450" y="190" fill="#e2e8f0" font-size="16" text-anchor="middle">Discriminator: Strided Convolutions (downsampling) — mirror of Generator</text>

  <rect x="30" y="220" width="60" height="60" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="60" y="255" fill="#e0e7ff" font-size="10" text-anchor="middle">64x64x3</text>

  <rect x="150" y="230" width="55" height="45" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
  <text x="177" y="257" fill="#fed7aa" font-size="9" text-anchor="middle">32x32x64</text>

  <rect x="260" y="238" width="50" height="35" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
  <text x="285" y="260" fill="#fed7aa" font-size="8" text-anchor="middle">16x16x128</text>

  <rect x="370" y="244" width="45" height="25" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
  <text x="392" y="262" fill="#fed7aa" font-size="8" text-anchor="middle">8x8x256</text>

  <rect x="470" y="248" width="35" height="18" fill="#4c0519" stroke="#fb7185" stroke-width="2"/>
  <text x="487" y="278" fill="#fda4af" font-size="9" text-anchor="middle">real/fake</text>

  <path d="M90,250 L150,250" stroke="#94a3b8" stroke-width="2" marker-end="url(#a3)"/>
  <path d="M205,252 L260,255" stroke="#94a3b8" stroke-width="2" marker-end="url(#a3)"/>
  <path d="M310,255 L370,256" stroke="#94a3b8" stroke-width="2" marker-end="url(#a3)"/>
  <path d="M415,257 L470,257" stroke="#94a3b8" stroke-width="2" marker-end="url(#a3)"/>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>

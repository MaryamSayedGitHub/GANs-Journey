<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="300" fill="#0f172a"/>

  <rect x="20" y="70" width="110" height="55" rx="8" fill="#3730a3" stroke="#818cf8" stroke-width="2"/>
  <text x="75" y="102" fill="#e0e7ff" font-size="13" text-anchor="middle">Noise z</text>

  <rect x="20" y="150" width="110" height="55" rx="8" fill="#581c87" stroke="#c084fc" stroke-width="2"/>
  <text x="75" y="182" fill="#f3e8ff" font-size="13" text-anchor="middle">Label y</text>

  <rect x="180" y="60" width="70" height="160" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2" stroke-dasharray="4"/>
  <text x="215" y="145" fill="#cbd5e1" font-size="11" text-anchor="middle" transform="rotate(-90 215 145)">concat [z, embed(y)]</text>

  <rect x="290" y="90" width="150" height="100" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
  <text x="365" y="135" fill="#e2e8f0" font-size="14" text-anchor="middle">Generator G</text>
  <text x="365" y="155" fill="#5eead4" font-size="10" text-anchor="middle">G(z, y) -&gt; fake image of class y</text>

  <rect x="480" y="30" width="110" height="60" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="535" y="65" fill="#e2e8f0" font-size="12" text-anchor="middle">Fake image</text>

  <rect x="480" y="210" width="110" height="60" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="535" y="245" fill="#e2e8f0" font-size="12" text-anchor="middle">Real image + y</text>

  <rect x="630" y="90" width="70" height="160" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2" stroke-dasharray="4"/>
  <text x="665" y="175" fill="#cbd5e1" font-size="11" text-anchor="middle" transform="rotate(-90 665 175)">concat [img, embed(y)]</text>

  <rect x="740" y="90" width="140" height="120" rx="8" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
  <text x="810" y="140" fill="#fed7aa" font-size="14" text-anchor="middle">Discriminator D</text>
  <text x="810" y="160" fill="#fed7aa" font-size="10" text-anchor="middle">D(img, y) real/fake</text>

  <path d="M130,97 L180,110" stroke="#94a3b8" stroke-width="2" marker-end="url(#a4)"/>
  <path d="M130,177 L180,160" stroke="#94a3b8" stroke-width="2" marker-end="url(#a4)"/>
  <path d="M250,140 L290,140" stroke="#94a3b8" stroke-width="2" marker-end="url(#a4)"/>
  <path d="M440,120 L480,60" stroke="#94a3b8" stroke-width="2" marker-end="url(#a4)"/>
  <path d="M590,60 L630,140" stroke="#94a3b8" stroke-width="2" marker-end="url(#a4)"/>
  <path d="M590,240 L630,180" stroke="#94a3b8" stroke-width="2" marker-end="url(#a4)"/>
  <path d="M700,160 L740,150" stroke="#94a3b8" stroke-width="2" marker-end="url(#a4)"/>

  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="450" y="290" fill="#64748b" font-size="12" text-anchor="middle">الفرق عن Vanilla GAN: كل من G و D بياخدوا الـ label y كمعلومة إضافية للتحكم في الفئة</text>
</svg>
